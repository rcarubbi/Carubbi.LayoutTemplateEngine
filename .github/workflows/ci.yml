name: CI

on:
  push:
    branches: [master]

  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build (Release)
        run: dotnet build Carubbi.LayoutTemplateEngine.slnx -c Release

      - name: Test (Release)
        run: dotnet run --project tests/Carubbi.LayoutTemplateEngine.Tests/Carubbi.LayoutTemplateEngine.Tests.csproj -c Release --no-build
